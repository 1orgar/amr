name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run Unit Tests (Blocking Gate)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun swift --version

      - name: Setup MusicKit Auth Key
        env:
          MUSICKIT_KEY_P8: ${{ secrets.MUSICKIT_KEY_P8 }}
        run: |
          if [ -n "$MUSICKIT_KEY_P8" ]; then
            if echo "$MUSICKIT_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
              echo "$MUSICKIT_KEY_P8" > AuthKey_MJHWRCSZHH.p8
            else
              echo "$MUSICKIT_KEY_P8" | base64 --decode > AuthKey_MJHWRCSZHH.p8
            fi
            chmod 600 AuthKey_MJHWRCSZHH.p8
            echo "✅ AuthKey_MJHWRCSZHH.p8 successfully restored for test"
          else
            echo "⚠️ MUSICKIT_KEY_P8 secret not found; running tests with fallback"
          fi

      - name: Run Swift Unit Tests
        run: |
          xcrun swift test --package-path AppleMusicRemoteMac

  build-and-release:
    name: Build Universal DMG & Publish Release
    needs: test
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun swift --version

      - name: Setup MusicKit Auth Key
        env:
          MUSICKIT_KEY_P8: ${{ secrets.MUSICKIT_KEY_P8 }}
        run: |
          if [ -n "$MUSICKIT_KEY_P8" ]; then
            if echo "$MUSICKIT_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
              echo "$MUSICKIT_KEY_P8" > AuthKey_MJHWRCSZHH.p8
            else
              echo "$MUSICKIT_KEY_P8" | base64 --decode > AuthKey_MJHWRCSZHH.p8
            fi
            chmod 600 AuthKey_MJHWRCSZHH.p8
            echo "✅ AuthKey_MJHWRCSZHH.p8 successfully restored for build"
          else
            echo "⚠️ MUSICKIT_KEY_P8 secret not found; build will proceed with fallback behavior"
          fi

      - name: Build Universal DMG (Intel x86_64 + Apple Silicon arm64)
        run: |
          chmod +x ./build_universal_dmg.sh
          ./build_universal_dmg.sh
          shasum -a 256 AppleMusicRemoteMac-Universal.dmg > AppleMusicRemoteMac-Universal.dmg.sha256

      - name: Prepare Release Metadata
        id: release_meta
        run: |
          if [ -f "RELEASE_TITLE.txt" ]; then
            RELEASE_NAME=$(cat RELEASE_TITLE.txt)
          else
            RELEASE_NAME="${{ github.ref_name }}"
          fi
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "body_path=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          else
            git tag -l --format='%(contents)' "${{ github.ref_name }}" > /tmp/tag_body.txt 2>/dev/null || true
            if [ -s /tmp/tag_body.txt ]; then
              echo "body_path=/tmp/tag_body.txt" >> $GITHUB_OUTPUT
            else
              echo "body_path=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: ${{ steps.release_meta.outputs.body_path }}
          files: |
            AppleMusicRemoteMac-Universal.dmg
            AppleMusicRemoteMac-Universal.dmg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
