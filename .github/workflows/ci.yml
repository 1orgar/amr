name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Build Verification
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun swift --version

      - name: Run Swift Unit Tests (Blocking)
        run: |
          xcrun swift test --package-path AppleMusicRemoteMac

      - name: Verify Universal Binary Compilation
        run: |
          echo "Verifying arm64 build..."
          xcrun swift build --package-path AppleMusicRemoteMac --triple arm64-apple-macosx14.0
          echo "Verifying x86_64 build..."
          xcrun swift build --package-path AppleMusicRemoteMac --triple x86_64-apple-macosx14.0
