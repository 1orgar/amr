name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Build Verification
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun swift --version

      - name: Setup MusicKit Auth Key
        env:
          MUSICKIT_KEY_P8: ${{ secrets.MUSICKIT_KEY_P8 }}
        run: |
          if [ -n "$MUSICKIT_KEY_P8" ]; then
            if echo "$MUSICKIT_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
              echo "$MUSICKIT_KEY_P8" > AuthKey_MJHWRCSZHH.p8
            else
              echo "$MUSICKIT_KEY_P8" | base64 --decode > AuthKey_MJHWRCSZHH.p8
            fi
            chmod 600 AuthKey_MJHWRCSZHH.p8
            echo "✅ AuthKey_MJHWRCSZHH.p8 successfully restored for CI tests"
          else
            echo "ℹ️ MUSICKIT_KEY_P8 secret not found; running tests with fallback"
          fi

      - name: Run Swift Unit Tests (Blocking)
        run: |
          xcrun swift test --package-path AppleMusicRemoteMac

      - name: Verify Universal Binary Compilation
        run: |
          echo "Verifying arm64 build..."
          xcrun swift build --package-path AppleMusicRemoteMac --triple arm64-apple-macosx14.0
          echo "Verifying x86_64 build..."
          xcrun swift build --package-path AppleMusicRemoteMac --triple x86_64-apple-macosx14.0
