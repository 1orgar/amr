<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Squircle Shadow (HIG Standard) -->
    <filter id="macSquircleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Deep Ambient Background Gradient -->
    <linearGradient id="macBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="35%" stop-color="#150f28"/>
      <stop offset="70%" stop-color="#1f1138"/>
      <stop offset="100%" stop-color="#2a0f40"/>
    </linearGradient>

    <!-- Apple Music Vibrant Signature Gradient -->
    <linearGradient id="macMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa233b"/>
      <stop offset="22%" stop-color="#ff2d55"/>
      <stop offset="50%" stop-color="#c837ab"/>
      <stop offset="75%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Broadcast Signal Wave Gradient -->
    <linearGradient id="macSignalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa233b"/>
      <stop offset="45%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="macSoftGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Note Drop Shadow -->
    <filter id="macNoteShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#fa233b" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Ambient Glow Spots -->
    <radialGradient id="macRedSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fa233b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fa233b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="macPurpleSpot" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="macCyanSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- macOS Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS App Squircle Base (Clean, No Stroke / No White Border) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#macBgGrad)" filter="url(#macSquircleShadow)"/>

  <!-- Inside Squircle Content -->
  <g clip-path="url(#squircleClip)">
    <!-- Ambient Internal Illumination -->
    <circle cx="320" cy="320" r="340" fill="url(#macRedSpot)"/>
    <circle cx="720" cy="460" r="360" fill="url(#macPurpleSpot)"/>
    <circle cx="750" cy="300" r="220" fill="url(#macCyanSpot)"/>

    <!-- Subtle Background Equalizer Waves (Colored Tint, No White) -->
    <g opacity="0.25">
      <rect x="210" y="440" width="8" height="144" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="240" y="390" width="8" height="244" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="270" y="350" width="8" height="324" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="300" y="410" width="8" height="204" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="720" y="430" width="8" height="164" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="750" y="370" width="8" height="284" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="780" y="330" width="8" height="364" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="810" y="410" width="8" height="204" rx="4" fill="url(#macMusicGrad)"/>
    </g>

    <!-- Wireless Broadcast Remote Waves (Glowing Neon) -->
    <g fill="none" stroke-linecap="round">
      <path d="M 640 340 A 220 220 0 0 1 735 435" stroke="url(#macSignalGrad)" stroke-width="13" opacity="0.95" filter="url(#macSoftGlow)"/>
      <path d="M 672 308 A 265 265 0 0 1 785 420" stroke="url(#macSignalGrad)" stroke-width="10" opacity="0.75" filter="url(#macSoftGlow)"/>
      <path d="M 704 275 A 310 310 0 0 1 835 405" stroke="url(#macSignalGrad)" stroke-width="7" opacity="0.5"/>
    </g>

    <!-- Equalizer Accents Near Notes -->
    <g opacity="0.9" filter="url(#macSoftGlow)">
      <rect x="310" y="480" width="12" height="110" rx="6" fill="url(#macMusicGrad)"/>
      <rect x="338" y="445" width="12" height="165" rx="6" fill="url(#macMusicGrad)"/>
      <rect x="366" y="520" width="12" height="85" rx="6" fill="url(#macMusicGrad)"/>
      
      <rect x="646" y="465" width="12" height="140" rx="6" fill="url(#macMusicGrad)"/>
      <rect x="674" y="430" width="12" height="195" rx="6" fill="url(#macMusicGrad)"/>
      <rect x="702" y="500" width="12" height="105" rx="6" fill="url(#macMusicGrad)"/>
    </g>

    <!-- 3D Musical Note Glyph (Vibrant Signature Gradient with Warm Drop Shadow) -->
    <g filter="url(#macNoteShadow)">
      <!-- Left Note Head -->
      <ellipse cx="395" cy="660" rx="74" ry="56" transform="rotate(-22 395 660)" fill="url(#macMusicGrad)"/>
      <!-- Right Note Head -->
      <ellipse cx="630" cy="575" rx="74" ry="56" transform="rotate(-22 630 575)" fill="url(#macMusicGrad)"/>

      <!-- Stems -->
      <rect x="445" y="340" width="28" height="320" rx="4" fill="url(#macMusicGrad)"/>
      <rect x="680" y="255" width="28" height="320" rx="4" fill="url(#macMusicGrad)"/>

      <!-- Crossbars (Beams) -->
      <polygon points="445,340 708,255 708,318 445,403" fill="url(#macMusicGrad)"/>
      <polygon points="445,423 708,338 708,373 445,458" fill="url(#macMusicGrad)" opacity="0.92"/>
    </g>

    <!-- Subtle Bevel Reflections (Colored / Semi-transparent, No Harsh White Outlines) -->
    <g fill="#ff80bf" opacity="0.25">
      <polygon points="447,342 706,257 706,268 447,353"/>
      <ellipse cx="382" cy="648" rx="36" ry="22" transform="rotate(-22 382 648)" fill="#ffffff" opacity="0.18"/>
      <ellipse cx="617" cy="563" rx="36" ry="22" transform="rotate(-22 617 563)" fill="#ffffff" opacity="0.18"/>
    </g>
  </g>
</svg>
